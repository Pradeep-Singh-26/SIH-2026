services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dam-flood-backend:latest
    container_name: dam-flood-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODE=MOCK
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/sim_outputs:/app/backend/sim_outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flood-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: dam-flood-frontend:latest
    container_name: dam-flood-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - flood-net

networks:
  flood-net:
    driver: bridge
